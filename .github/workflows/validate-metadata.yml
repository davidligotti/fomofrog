name: Validate FomoFrog metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate canonical metadata and evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const canonical = 'H7N8GMFegfmFvV2Vrqkm7DpAoK1CBj6KdvwBkSdQpump';
          const token = JSON.parse(fs.readFileSync('token.json', 'utf8'));
          const requiredDocs = ['LISTING-STATUS.md', 'TRANSPARENCY.md', 'SECURITY.md', 'AGENTS.md'];
          const requiredLinks = { website: 'https://fomofrog.com' };

          if (token.chainId !== 101) throw new Error('chainId must be Solana mainnet (101)');
          if (token.address !== canonical) throw new Error('token address is not the canonical FomoFrog mint');
          if (token.symbol !== 'FOMO' || token.name !== 'FomoFrog') throw new Error('token name or symbol mismatch');
          if (token.decimals !== 6) throw new Error('decimals mismatch');
          if (token.logoURI !== 'https://raw.githubusercontent.com/davidligotti/fomofrog/main/fomofrog_logo_512.png') {
            throw new Error('logoURI must use the verified repository asset');
          }
          for (const [key, value] of Object.entries(requiredLinks)) {
            if (!token.extensions || token.extensions[key] !== value) throw new Error('official link mismatch: ' + key);
          }
          for (const file of requiredDocs) {
            if (!fs.existsSync(file)) throw new Error('required evidence document missing: ' + file);
          }

          const bannedSecret = /(BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|xox[baprs]-|ghp_[A-Za-z0-9]{30,})/;
          const ignored = new Set(['.git', '.github']);
          function walk(dir) {
            const files = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignored.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) files.push(...walk(full));
              else if (!/\.(png|jpg|jpeg|gif|ico|woff2?)$/i.test(entry.name)) files.push(full);
            }
            return files;
          }
          for (const file of walk('.')) {
            const text = fs.readFileSync(file, 'utf8');
            if (bannedSecret.test(text)) throw new Error('potential secret material found in ' + file);
          }

          for (const file of requiredDocs.slice(0, 3)) {
            const text = fs.readFileSync(file, 'utf8');
            if (!/(2026-09-03|Last verified|Current as of)/.test(text)) throw new Error('missing evidence date in ' + file);
            if (!text.includes(canonical)) throw new Error('canonical mint missing from ' + file);
          }
          console.log('canonical metadata, evidence documents, and secret scan validated');
          NODE
